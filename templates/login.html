<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GranaFlow | Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>GranaFlow</h1>

            <p>
                Entenda para onde seu dinheiro vai.
            </p>
            {% with mensagens = get_flashed_messages() %}

    {% if mensagens %}

        {% for mensagem in mensagens %}

            <p class="mensagem">
                {{ mensagem }}
            </p>

        {% endfor %}

    {% endif %}

{% endwith %}
            <form method="POST">

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="seuemail@email.com"
        required
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        name="senha"
        placeholder="Sua senha"
        required
    >

    <button type="submit">
        Entrar
    </button>

</form>

            <p>
                Ainda não possui conta?

                <a href="{{ url_for('cadastro') }}">
                    Criar conta
                </a>
            </p>

        </div>

    </main>

</body>

</html>
