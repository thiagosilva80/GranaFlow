<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GranaFlow | Cadastro</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>Crie sua conta</h1>

            <p>
                Comece a organizar melhor o seu dinheiro.
            </p>

            {% with mensagens = get_flashed_messages() %}

                {% if mensagens %}

                    {% for mensagem in mensagens %}

                        <p class="mensagem">
                            {{ mensagem }}
                        </p>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome"
                    required
                >


                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@email.com"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                >


                <button type="submit">
                    Criar conta
                </button>

            </form>


            <p>
                Já possui uma conta?

                <a href="{{ url_for('login') }}">
                    Entrar
                </a>
            </p>

        </div>

    </main>

</body>

</html>
